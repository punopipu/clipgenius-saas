<script>
    // Inicialización de Paddle Classic
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof Paddle !== 'undefined') {
        Paddle.Setup({ vendor: 445362 });
      }
    });

    function subscribeWithPaddle(priceId) {
      if (typeof Paddle === 'undefined') {
        alert("El script de Paddle aún está cargando. Intenta de nuevo en unos segundos.");
        return;
      }

      // Abrir pasarela de Paddle Classic
      Paddle.Checkout.open({
        product: priceId,
        successCallback: function(data) {
          alert("¡Pago realizado con éxito! Bienvenido a ClipGenius.");
          document.getElementById('paywall-card').classList.add('hidden');
          document.getElementById('analyzer-card').classList.remove('hidden');
        }
      });
    }

    // Lógica para enviar el archivo al backend seguro
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    let selectedFile = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('file-label').innerText = `Seleccionado: ${selectedFile.name}`;
      }
    };

    async function processAnalysis() {
      if (!selectedFile) return alert("Por favor selecciona un archivo primero.");
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Procesando con IA...";

      try {
        const formData = new FormData();
        formData.append("file", selectedFile);

        const response = await fetch("/api/analyze", {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Error al analizar");

        const resultsDiv = document.getElementById('results');
        resultsDiv.classList.remove('hidden');
        resultsDiv.innerHTML = `
          <h3 class="text-lg font-bold text-indigo-400">Resumen Ejecutivo</h3>
          <p class="text-slate-300 text-sm mb-4">${data.resumen_ejecutivo}</p>
        `;
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Iniciar Análisis";
      }
    }
  </script>
